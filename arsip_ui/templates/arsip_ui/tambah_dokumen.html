{% extends "arsip_ui/layout.html" %}

{% load static %}
{% block title %}
    Tambah Dokumen
{% endblock %}

{% block content %}
    <section class="px-3 overflow-y-auto mt-[65px]">
        <main class="mx-14 md:mx-[150px] lg:mx-[250px] xl:mx-[400px]">
            <h1 class="text-2xl font-bold my-4 block dark:text-white">Tambah Dokumen</h1>
            <form method="post" action="" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-4 grid grid-cols-12 items-center">
                    <label for="tanggal-surat" class="text-md font-medium text-gray-700 col-span-3 dark:text-white">Tanggal Surat:</label>
                    <input
                        name="tanggal_surat"
                        type="date"
                        id="tanggal-surat"
                        class="shadow appearance-none border dark:border-gray-400 rounded col-span-9 w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline dark:text-white dark:bg-transparent"
                    />
                </div>
                <div class="mb-4 grid grid-cols-12 items-center">
                    <label for="nomor" class="text-md font-medium text-gray-700 col-span-3 dark:text-white">Nomor:</label>
                    <input
                        name="nomor"
                        type="text"
                        id="nomor"
                        class="shadow appearance-none border dark:border-gray-400 rounded col-span-9 w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline dark:text-white dark:bg-transparent"
                    />
                </div>
                <div class="mb-4 grid grid-cols-12 items-center">
                    <label for="sifat" class="text-md font-medium text-gray-700 col-span-3 dark:text-white">Sifat:</label>
                    <div class="relative col-span-9">
                        <select
                            name="sifat"
                            id="sifat"
                            class="appearance-none shadow border dark:border-gray-400 rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white pr-10 dark:text-white dark:bg-transparent"
                        >
                            <option value="Tidak ada" class="dark:bg-gray-700">Tidak Ada</option>
                            <option value="Biasa" class="dark:bg-gray-700">Biasa</option>
                            <option value="Segera" class="dark:bg-gray-700">Segera</option>
                            <option value="Penting" class="dark:bg-gray-700">Penting</option>
                            <option value="Rahasia" class="dark:bg-gray-700">Rahasia</option>
                            <option value="Amat Rahasia" class="dark:bg-gray-700">Amat Rahasia</option>
                            <option value="Khusus" class="dark:bg-gray-700">Khusus</option>
                        </select>
                        <div class="absolute inset-y-0 right-2 flex items-center pointer-events-none">
                            <img src="{% static 'arsip_ui/img/chevron-down.svg' %}" alt="dropdown" class="w-5 h-5 text-gray-500 dark:invert">
                        </div>
                    </div>
                </div>   
                <div class="mb-4 grid grid-cols-12 items-center">
                    <label for="klasifikasi" class="text-md font-medium text-gray-700 col-span-3 dark:text-white">Klasifikasi:</label>
                    <input
                        name="klasifikasi"
                        type="text"
                        id="klasifikasi"
                        class="shadow appearance-none border dark:border-gray-400 rounded col-span-9 w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline dark:text-white dark:bg-transparent"
                    />
                </div>
                <div class="mb-4 grid grid-cols-12 items-center">
                    <label for="perihal" class="text-md font-medium text-gray-700 col-span-3 dark:text-white">Perihal:</label>
                    <input
                        name="perihal"
                        type="text"
                        id="perihal"
                        class="shadow appearance-none border dark:border-gray-400 rounded col-span-9 w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline dark:text-white dark:bg-transparent"
                    />
                </div>
                <div class="mb-4 grid grid-cols-12 items-center">
                    <label for="file" class="text-md font-medium text-gray-700 col-span-3 dark:text-white">File:</label>
                    <div id="drop-area" class="w-80 h-32 mx-auto text-center dark:text-white flex items-center justify-center border-2 border-dashed border-gray-400 cursor-pointer flex-col z-20 bg-white dark:bg-transparent">
                        <img src="{% static 'arsip_ui/img/cloud-upload-icon.svg' %}" class="w-8 dark:invert" alt="upload">
                        <p>Geser ke sini atau</p>
                        <p>Klik untuk Upload.</p>
                    </div>
                    <input
                        name="file"
                        type="file"
                        id="file"
                        class="appearance-none z-10 hidden"
                    />
                </div>
                <p id="file-info" class="text-blue-500 dark:text-blue-300 my-5" ></p>
                <div class="grid grid-cols-2 w-1/2 sm:w-1/3 gap-2 md:w-1/3 items-center">
                    <button
                        type="submit"
                        id="submit-btn"
                        class="px-4 py-2 w-full bg-blue-500 dark:bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-600 dark:hover:bg-blue-700 text-center"
                    >
                        Simpan
                    </button>
                    <a href="{% url 'daftar_dokumen' %}" class="px-4 py-2 w-full bg-red-500 dark:bg-red-600 text-white justify-center flex text-sm font-medium rounded-md hover:bg-red-600 dark:hover:bg-red-700 text-center">
                        Batal
                    </a>
                </div>
            </form>  
        </main>
    </section>
    <script src='{% static "arsip_ui/scripts/index/document.js" %}'></script>
{% endblock %}
