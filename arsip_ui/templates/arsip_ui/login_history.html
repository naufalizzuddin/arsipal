{% extends "arsip_ui/layout.html" %}

{% load static %}
{% block title %}
    Login History
{% endblock %}

{% block content %}
    <div class="container mx-auto p-4 mt-[65px]">
        <h1 class="text-lg font-bold mb-3 dark:text-white">Riwayat Masuk</h1>
        <div class="h-[calc(100vh-165px)] overflow-y-auto rounded-lg">
            <table class="text-left w-full lg:min-w-[300px] rounded-lg border-separate border-spacing-0">
                <thead class="sticky top-0 text-center bg-gray-200 z-20 border border-gray-300 dark:border-gray-500 dark:bg-[#263544]">
                    <tr class="border border-gray-300 dark:bg-[#263544] dark:text-white bg-gray-200 text-center">
                        <th class="px-4 py-2 border border-gray-300 dark:border-gray-500">Nama Pengguna</th>
                        <th class="px-4 py-2 border border-gray-300 dark:border-gray-500">Waktu Login</th>
                    </tr>
                </thead>
                <tbody class="bg-white dark:bg-gray-700 text-black dark:text-white">
                    {% for login in logins %}
                    <tr class="hover:bg-gray-100 dark:hover:bg-gray-600 text-center">
                        <td class="px-4 py-2 border border-gray-300 dark:border-gray-500">{{ login.user }}</td>
                        <td class="px-4 py-2 border border-gray-300 dark:border-gray-500">{{ login.login_time }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
{% endblock %}
