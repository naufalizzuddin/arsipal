<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsipal - Login</title>
    {% load static %}
    <link rel="shortcut icon" type="image/png" href="{% static 'arsip_ui/img/favicon.svg' %}">
    <script src="{% static 'arsip_ui/scripts/tailwind.js' %}"></script>
    <script src="{% static 'arsip_ui/scripts/login/darkmode.js' %}"></script>
</head>
<body class="h-screen w-screen flex">
    <div class="w-1/2 h-full md:flex flex-col items-center justify-center bg-gradient-to-r bg-[#4DA2CD] dark:bg-blue-600 text-white relative hidden">
        <img src="{% static 'arsip_ui/img/open-book.svg' %}" alt="Open Book" class="w-24 h-24 z-30">
        <h1 class="text-5xl font-extrabold mt-6 z-30">ARSIPAL</h1>
        <p class="text-lg mt-2 font-light text-center z-30">Sistem Pengarsipan Lokal Kecamatan Banyumanik</p>
        <img src="{% static 'arsip_ui/img/bg-kecbanyumanik.jpeg' %}" alt="bg-kecbanyumanik" class="object-cover h-full absolute z-10 blur-sm">
        <div class="absolute inset-0 bg-blue-500 dark:bg-blue-900 opacity-50 z-20"></div>
    </div>
    <div class="w-full md:w-1/2 h-full flex items-center justify-center bg-gray-50 dark:bg-[#263544] relative">
        <img src="{% static 'arsip_ui/img/bg-kecbanyumanik.jpeg' %}" alt="bg-kecbanyumanik" class="object-cover h-full absolute z-10 blur-sm flex md:hidden">
        <div class="absolute inset-0 bg-blue-500 dark:bg-blue-900 opacity-50 z-20 flex md:hidden"></div>
        <div class="w-full max-w-md bg-white dark:bg-[#344C64] p-10 rounded-2xl shadow-2xl z-30 border border-2 dark:border-gray-500">
            <h2 class="text-4xl font-bold text-gray-800 dark:text-white text-center mb-1">Login</h2>
            <p class="text-gray-500 dark:text-gray-300 text-center mb-8">Silahkan login terlebih dahulu!</p>

            <form method="post" action="">
                {% csrf_token %}
                <div class="mb-6">
                    <label for="username" class="block text-gray-700 dark:text-white font-semibold mb-2">Username</label>
                    <input id="username" type="text" name="username" required
                        class="w-full px-4 py-3 border dark:border-gray-400 rounded-xl dark:bg-transparent focus:outline-none focus:ring-4 focus:ring-blue-300 shadow-sm dark:text-white"
                        placeholder="Masukkan username Anda">
                </div>

                <div class="mb-6">
                    <label for="password" class="block text-gray-700 dark:text-white font-semibold mb-2">Password</label>
                    <input id="password" type="password" name="password" required
                        class="w-full px-4 py-3 border dark:border-gray-400 rounded-xl dark:bg-transparent focus:outline-none focus:ring-4 focus:ring-blue-300 shadow-sm dark:text-white"
                        placeholder="Masukkan password Anda">
                </div>

                <div class="flex items-center justify-between mb-6">
                    <label class="flex items-center text-gray-600">
                    <input name="remember_me" type="checkbox" class="form-checkbox rounded text-blue-500">
                    <span class="ml-2 text-sm dark:text-white">Remember me</span>
                </div>

                <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-500 dark:from-blue-600 dark:to-blue-700 to-blue-600 text-white font-bold py-3 rounded-xl shadow-lg hover:from-blue-600 hover:to-blue-700 dark:hover:from-blue-700 dark:hover:to-blue-800">
                    Login
                </button>
            </form>
        </div>
    </div>
    <script src="{% static 'arsip_ui/scripts/sweetalert2.js' %}"></script>
    {% if messages %}
        <script>
            {% for message in messages %}
                const isDarkMode = (localStorage.getItem('theme') === 'dark');
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: "{% if 'success' in message.tags %}success{% elif 'error' in message.tags %}error{% else %}info{% endif %}",
                    title: "{{ message|escapejs }}",
                    showConfirmButton: false,
                    timer: 3000,
                    timerProgressBar: true,
                    background: isDarkMode ? "#344C64" : "#fff",
                    color: isDarkMode ? "#fff" : "#000",
                    didOpen: (toast) => {
                        toast.addEventListener('mouseenter', Swal.stopTimer)
                        toast.addEventListener('mouseleave', Swal.resumeTimer)
                    }
                });
            {% endfor %}
        </script>
    {% endif %}
</body>
</html>
