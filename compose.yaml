name: arsipal

services:
  web:
    build:
      context: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-arsipal-local-development-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      DATABASE_PATH: /app/data/db.sqlite3
      MEDIA_ROOT: /app/dokumen
    ports:
      - "127.0.0.1:${WEB_PORT:-8001}:8000"
    volumes:
      - sqlite_data:/app/data
      - document_data:/app/dokumen
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  sqlite_data:
  document_data:
